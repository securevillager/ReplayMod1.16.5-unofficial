name: Build ReplayMod

on:
  push:
    branches: [ "1.16.5" ]
  pull_request:
    branches: [ "1.16.5" ]
  workflow_dispatch:   # 手動実行ボタンも使えるようにする

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: JDK 8 をセットアップ
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: gradlewに実行権限を付与
        run: chmod +x gradlew

      - name: Gradleキャッシュを利用して高速化
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle') }}

      - name: ビルド実行
        run: ./gradlew build --stacktrace

      - name: 成果物(jar)をアップロード
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-outputs
          path: build/libs/*.jar
